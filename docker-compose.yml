services:
  # BeingDB server
  beingdb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beingdb-serve
    ports:
      - "8080:8080"
    volumes:
      # Mount pack_store directory directly
      # Note: Not :ro because Irmin needs to write lock files and metadata
      - ./pack_store:/data/pack_store
    environment:
      # Pack store to serve
      SNAPSHOT_PATH: /data/pack_store
      PORT: 8080
      MAX_RESULTS: 5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/predicates >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: beingdb-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      beingdb:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - production  # Only start with: docker compose --profile production up
